worker_processes auto;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;

    client_max_body_size 70m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    gzip               on;
    gzip_vary          on;
    gzip_min_length    1024;
    gzip_comp_level    5;
    gzip_proxied       any;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json application/xml+rss
        application/atom+xml application/x-javascript application/wasm
        image/svg+xml font/woff font/woff2;


    gzip_static on;
    # brotli_static on; 

    server {
        listen 80;
        server_name pulseapp.space grafana.pulseapp.space;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name pulseapp.space;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_session_timeout 1d;
        ssl_session_cache shared:MozSSL:10m;
        ssl_protocols TLSv1.2 TLSv1.3;

        location ^~ /media/ {
            proxy_pass http://host.docker.internal:9000/media/;
            proxy_http_version 1.1;
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            add_header Cache-Control "public, max-age=86400" always;
        }

        location ^~ /api/ {
            proxy_pass http://host.docker.internal:8088;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        root /usr/share/nginx/html;
        index index.html;

        location ~* ^/bundle\..+\.[a-f0-9]+\.(js|css)$ {
            access_log off;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        location ~* \.(?:png|jpe?g|gif|webp|svg|ico|woff2?|ttf|otf|mp3|mp4|webm)$ {
            access_log off;
            add_header Cache-Control "public, max-age=86400" always;
            try_files $uri =404;
        }

        location = /service-worker.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            try_files $uri =404;
        }

        location = /manifest.json {
            add_header Cache-Control "no-cache" always;
            try_files $uri =404;
        }

        location / {
            add_header Cache-Control "no-cache" always;
            try_files $uri $uri/ /index.html;
        }
    }

    # ───────── grafana ─────────
    server {
        listen 443 ssl;
        http2 on;
        server_name grafana.pulseapp.space;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_session_timeout 1d;
        ssl_session_cache shared:MozSSL:10m;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://host.docker.internal:3001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400;
        }
    }
}
